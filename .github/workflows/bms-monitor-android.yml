name: BMS Monitor Android app

on:
  push:
    paths:
      - "jbd-bms-monitor/**"
      - ".github/workflows/bms-monitor-android.yml"
  pull_request:
    paths:
      - "jbd-bms-monitor/**"
      - ".github/workflows/bms-monitor-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bms-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jbd-bms-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a permanent signing key stored in repository secrets lets each new
      # build install over the previous one. See jbd-bms-monitor/README.md.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BMS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bms-release.keystore"
            echo "BMS_KEYSTORE_FILE=$RUNNER_TEMP/bms-release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with the permanent release key, so it installs over earlier versions." >> "$GITHUB_ENV"
          else
            echo "::warning::BMS_KEYSTORE_BASE64 secret not set; signing with a temporary debug key."
            echo "SIGNING_NOTE=Signed with a temporary key: if an older version is installed, uninstall it first." >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BMS_KEYSTORE_PASSWORD: ${{ secrets.BMS_KEYSTORE_PASSWORD }}
          BMS_KEY_ALIAS: ${{ secrets.BMS_KEY_ALIAS }}
          BMS_KEY_PASSWORD: ${{ secrets.BMS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BMS-Monitor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMS-Monitor-apk
          path: jbd-bms-monitor/BMS-Monitor.apk

      - name: Publish APK as a GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "bms-monitor-v$VERSION" BMS-Monitor.apk \
            --target "${{ github.sha }}" \
            --title "BMS Monitor $VERSION" \
            --latest \
            --notes "Android tablet app that monitors three JBD BMS batteries over Bluetooth.

          **Install:** on the tablet, download **BMS-Monitor.apk** below, open it, and allow installing from your browser if Android asks.

          $SIGNING_NOTE

          Built from \`${{ github.ref_name }}\` at ${{ github.sha }}."

  # Renders the real screens with sample data (Robolectric) and attaches them to the
  # release. Optional: a failure here never affects the APK.
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: jbd-bms-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pscreenshots :app:testDebugUnitTest --tests '*ScreenshotTest*'
          ls -la app/build/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BMS-Monitor-screenshots
          path: jbd-bms-monitor/app/build/screenshots
          if-no-files-found: ignore

      - name: Attach screenshots to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "bms-monitor-v1.0.${{ github.run_number }}" app/build/screenshots/*.png --clobber
